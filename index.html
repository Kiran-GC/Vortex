<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vortex</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <div class="view active" id="homeView">

        <div class="home-content">

            <div class="center-block">

                <div class="logo-placeholder">
                    <img src="./assets/vortex.svg" alt="Vortex Logo" class="vortex-logo">
                </div>

                <h1>Vortex</h1>

            </div>

            <div class="menu-buttons">
                <button class="nav-btn" data-target="utilitiesView">Utilities +</button>
                <button>Layers</button>
                <button class="nav-btn" data-target="motionView">Motion</button>
                <button>Utilities</button>
                <button>Settings</button>
            </div>

        </div>

        <div class="footer">
            Developed by Kiran
        </div>

    </div>

    <div class="view" id="utilitiesView">

        <button class="back-btn" data-target="homeView">Back</button>

        <div class="center-block">
            <h2>Utilities +</h2>
        </div>

        <div class="menu-buttons">
            <button class="nav-btn tool-btn" data-target="effectsView">
                Effects Copy
            </button>
        </div>

    </div>

    <div class="view" id="effectsView">

        <button class="back-btn" data-target="utilitiesView">Back</button>

        <div class="center-block">
            <h2>Effects Copy</h2>
        </div>

        <div class="menu-buttons">
            <button id="copyEffectsBtn">Copy Effects</button>
            <button id="applyEffectsBtn">Apply Effects</button>
        </div>

    </div>

    <div class="view" id="motionView">

        <button class="back-btn" data-target="homeView">Back</button>

        <div class="center-block">
            <h2>Motion</h2>
            <p class="view-description">Apply .ffx animation presets to selected text layers.</p>
        </div>

        <div class="menu-buttons preset-actions">
            <button id="importTextPresetBtn">Import .ffx</button>
            <button id="previewTextPresetBtn" disabled>Preview</button>
            <button id="applyTextPresetBtn" disabled>Apply to Text</button>
        </div>

        <div class="preset-list" id="textPresetList"></div>

    </div>

    <div id="toast"></div>

    <script src="./CSInterface.js"></script>
    <script src="./js/aeBridge.js"></script>
    <script src="./js/main.js"></script>

</body>
</html>
